<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NovaPlay: a Flutter game store app with cart, checkout, library and admin CRUD. Web demo with sample data.">
  <meta name="theme-color" content="#30D507">

  <!-- link preview -->
  <meta property="og:title" content="NovaPlay · Game store demo">
  <meta property="og:description" content="A Flutter game store app with cart, checkout, library and admin CRUD. Web demo with sample data.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://muhammadmuneeb-mk.github.io/NovaPlay/">
  <meta property="og:image" content="https://muhammadmuneeb-mk.github.io/NovaPlay/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="NovaPlay logo next to a grid of game covers">
  <meta name="twitter:card" content="summary_large_image">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NovaPlay">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NovaPlay · Game store demo</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #F5F7FA;
      font-family: system-ui, sans-serif;
      transition: opacity 0.3s;
    }
    @media (prefers-color-scheme: dark) {
      #loading { background: #121212; }
    }
    #loading .brand {
      color: #30D507;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 2px;
    }
    #loading .spinner {
      width: 36px;
      height: 36px;
      margin: 18px auto 0;
      border: 4px solid rgba(48, 213, 7, 0.25);
      border-top-color: #30D507;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div>
      <div class="brand">NovaPlay</div>
      <div class="spinner"></div>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
